services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-report-db
    environment:
      POSTGRES_DB: sales_report
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: sales_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_user -d sales_report"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales-report-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sales_report
      DB_USER: sales_user
      DB_PASSWORD: sales_pass
      APP_BASE_URL: http://backend:8080
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales-report-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
